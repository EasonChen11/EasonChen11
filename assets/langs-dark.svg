<svg xmlns="http://www.w3.org/2000/svg" width="840" height="200" viewBox="0 0 840 200" role="img" aria-label="Most used languages">
<title>Most used languages</title>
<defs>
  <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1a1b27"/><stop offset="1" stop-color="#24283b"/>
  </linearGradient>
  <linearGradient id="foil" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="840" y2="200" spreadMethod="reflect">
    <stop offset="0" stop-color="#ff6ec7"/><stop offset="0.2" stop-color="#ffd36e"/>
    <stop offset="0.4" stop-color="#6effa8"/><stop offset="0.6" stop-color="#6ed6ff"/>
    <stop offset="0.8" stop-color="#a36eff"/><stop offset="1" stop-color="#ff6ec7"/>
    <animateTransform attributeName="gradientTransform" type="translate"
      values="0 0; 420 100; 0 0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="840" y2="0" gradientTransform="rotate(20)">
    <stop offset="0.40" stop-color="#fff" stop-opacity="0"/>
    <stop offset="0.50" stop-color="#fff" stop-opacity="0.22"/>
    <stop offset="0.60" stop-color="#fff" stop-opacity="0"/>
    <animateTransform attributeName="gradientTransform" type="translate" additive="sum"
      values="-840 0; 840 0" dur="5s" repeatCount="indefinite"/>
  </linearGradient>
  <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
    <path d="M0 6 L6 0" stroke="#7982a9" stroke-opacity="0.12" stroke-width="1"/>
  </pattern>
  <clipPath id="card"><rect x="4" y="4" width="832" height="192" rx="18"/></clipPath>
</defs><g clip-path="url(#card)">
  <rect width="840" height="200" fill="url(#body)"/>
  <rect width="840" height="200" fill="url(#grain)"/>
  <rect width="840" height="200" fill="url(#foil)" opacity="0.18"/>
  
  <g font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
    <text x="40" y="50" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="3" fill="#7982a9">LANGUAGES · BY BYTES ACROSS OWN REPOS · EXCL. NOTEBOOKS</text>
    <clipPath id="bar"><rect x="40" y="78" width="760" height="14" rx="7"/></clipPath>
    <rect x="40" y="78" width="760" height="14" rx="7" fill="#2f3549"/>
    <g clip-path="url(#bar)"><rect x="40.0" y="78" width="238.6" height="14" fill="#3572A5"><title>Python</title></rect><rect x="280.6" y="78" width="158.5" height="14" fill="#f34b7d"><title>C++</title></rect><rect x="441.1" y="78" width="148.0" height="14" fill="#555555"><title>C</title></rect><rect x="591.1" y="78" width="127.0" height="14" fill="#89e051"><title>Shell</title></rect><rect x="720.1" y="78" width="44.0" height="14" fill="#e34c26"><title>HTML</title></rect><rect x="766.1" y="78" width="10.8" height="14" fill="#663399"><title>CSS</title></rect><rect x="779.0" y="78" width="19.0" height="14" fill="#7982a9"><title>Other</title></rect></g>
    <circle cx="46.0" cy="125" r="6" fill="#3572A5"/><text x="60.0" y="130" font-size="15" fill="#c0caf5">Python <tspan fill="#7982a9" font-size="13">31.7%</tspan></text><circle cx="236.0" cy="125" r="6" fill="#f34b7d"/><text x="250.0" y="130" font-size="15" fill="#c0caf5">C++ <tspan fill="#7982a9" font-size="13">21.1%</tspan></text><circle cx="426.0" cy="125" r="6" fill="#555555"/><text x="440.0" y="130" font-size="15" fill="#c0caf5">C <tspan fill="#7982a9" font-size="13">19.7%</tspan></text><circle cx="616.0" cy="125" r="6" fill="#89e051"/><text x="630.0" y="130" font-size="15" fill="#c0caf5">Shell <tspan fill="#7982a9" font-size="13">17.0%</tspan></text><circle cx="46.0" cy="155" r="6" fill="#e34c26"/><text x="60.0" y="160" font-size="15" fill="#c0caf5">HTML <tspan fill="#7982a9" font-size="13">6.1%</tspan></text><circle cx="236.0" cy="155" r="6" fill="#663399"/><text x="250.0" y="160" font-size="15" fill="#c0caf5">CSS <tspan fill="#7982a9" font-size="13">1.7%</tspan></text><circle cx="426.0" cy="155" r="6" fill="#7982a9"/><text x="440.0" y="160" font-size="15" fill="#c0caf5">Other <tspan fill="#7982a9" font-size="13">2.8%</tspan></text>
  </g>
  <rect width="840" height="200" fill="url(#shine)"/>
</g>
<rect x="4" y="4" width="832" height="192" rx="18" fill="none" stroke="url(#foil)" stroke-width="3"/>
</svg>
