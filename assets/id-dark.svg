    <rect x="250" y="170" width="56" height="26" rx="13" fill="none" stroke="#7aa2f7" stroke-opacity="0.7"/><text x="278.0" y="188" text-anchor="middle" font-size="13" fill="#7aa2f7">Linux</text><rect x="316" y="170" width="80" height="26" rx="13" fill="none" stroke="#7aa2f7" stroke-opacity="0.7"/><text x="356.0" y="188" text-anchor="middle" font-size="13" fill="#7aa2f7">Embedded</text><rect x="406" y="170" width="96" height="26" rx="13" fill="none" stroke="#7aa2f7" stroke-opacity="0.7"/><text x="454.0" y="188" text-anchor="middle" font-size="13" fill="#7aa2f7">Networking</text>
    <line x1="250" y1="218" x2="800" y2="218" stroke="#7982a9" stroke-opacity="0.35"/>
    <text x="250.0" y="256" font-size="26" font-weight="700" fill="#c0caf5">20</text><text x="250.0" y="278" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1.5" fill="#7982a9">REPOS</text><text x="387.5" y="256" font-size="26" font-weight="700" fill="#c0caf5">1</text><text x="387.5" y="278" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1.5" fill="#7982a9">STARS</text><text x="525.0" y="256" font-size="26" font-weight="700" fill="#c0caf5">1</text><text x="525.0" y="278" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1.5" fill="#7982a9">FOLLOWERS</text><text x="662.5" y="256" font-size="26" font-weight="700" fill="#c0caf5">912</text><text x="662.5" y="278" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1.5" fill="#7982a9">CONTRIB / YR</text>
